# Балансировщик и кэш статики. Работает в Docker Compose (имя «web» резолвится Docker DNS в адреса всех экземпляров).
resolver 127.0.0.11 valid=10s ipv6=off;  # повторное разрешение имени: новые экземпляры подхватываются без перезапуска nginx

proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=200m inactive=7d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
    listen 80;
    server_tokens off;
    client_max_body_size 5m;
    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    set $app http://web:8000;
    # nosniff, Referrer-Policy, X-Frame-Options и Cache-Control для статики выставляет приложение (Django + WhiteNoise)
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_next_upstream error timeout http_502 http_503;  # при падении экземпляра запрос уходит на другой
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;

    location /static/ {  # файлы с хэшем в имени: кэш на неделю
        proxy_pass $app;
        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        add_header X-Cache $upstream_cache_status;
    }

    location ~ ^/api/auth/(login|register|password-reset|google)/ {  # защита от перебора паролей на периметре
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $app;
    }

    location / {
        proxy_pass $app;
    }
}
