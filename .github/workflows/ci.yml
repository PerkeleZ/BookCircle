name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: bookcircle, POSTGRES_USER: bookcircle, POSTGRES_PASSWORD: bookcircle}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookcircle" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes . | grep -v "unused\|unable to detect\|may be undefined" || true
      - name: Tests on SQLite
        run: python manage.py test
      - name: Tests on PostgreSQL + Redis
        run: python manage.py test
        env: {POSTGRES_HOST: localhost, REDIS_URL: "redis://localhost:6379/1"}
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: pip install -r requirements.txt
      - run: python manage.py migrate && python manage.py seed --reset
      - run: nohup python manage.py runserver 127.0.0.1:8140 --noreload > server.log 2>&1 &
      - run: sleep 6 && cd tests_ui && npm install && npm test
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bookcircle:ci .
