<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t=localStorage.getItem("bc_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);document.documentElement.setAttribute("data-bs-theme",t);})();</script>
<title>BookCircle — книжный клуб и обмен книгами</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { corePlugins: { preflight: false, container: false, visibility: false } }; // не ломаем стили Bootstrap</script>
<style>
:root{--ink:#1c2b33;--paper:#f0f3f1;--card:#fff;--muted:#66777f;--nav:#1c2b33;--pine:#1f6f62;--pine-d:#17544a;--gold:#c9962b;--star-off:#c5cfcb;--line:#d5ddd9}
[data-theme=dark]{--ink:#e6edf0;--paper:#11171a;--card:#1a2327;--muted:#9aa9b0;--nav:#0b1012;--pine:#2a8a7a;--pine-d:#23766a;--gold:#e0b04a;--star-off:#3b4a50;--line:#2b383e;--bs-body-bg:#11171a;--bs-body-color:#e6edf0;--bs-border-color:#2b383e;--bs-secondary-color:#9aa9b0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
h1,h2,h3,.brand{font-family:Literata,Georgia,serif}
.navbar{background:var(--nav)}
.brand{color:#fff;font-weight:700;font-size:1.3rem;text-decoration:none;margin-right:1.5rem}
.nav-link{color:#c9d6d1!important}.nav-link.active,.nav-link:hover{color:#fff!important}
.btn-pine{background:var(--pine);color:#fff;border:0}.btn-pine:hover{background:var(--pine-d);color:#fff}
.btn:focus-visible,a:focus-visible,.form-control:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cover{aspect-ratio:2/3;object-fit:cover;background:linear-gradient(160deg,#2c4a52,#1f6f62);border-radius:4px 10px 10px 4px;box-shadow:inset 6px 0 0 rgba(0,0,0,.18)}
.cover-ph{display:flex;align-items:center;justify-content:center;color:#e8f0ed;font-family:Literata,serif;padding:.6rem;text-align:center;font-size:.9rem}
.card-book{background:var(--card);border:1px solid var(--line);border-radius:8px}
.stars{white-space:nowrap;letter-spacing:1px}
.st{display:inline-block;background:linear-gradient(90deg,var(--gold) var(--f,0%),var(--star-off) var(--f,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.star-input{display:inline-flex;align-items:center}
.st-slot{position:relative;display:inline-block;font-size:2rem;line-height:1;margin-right:2px}
.st-slot .half{position:absolute;top:0;bottom:0;width:50%;opacity:0;cursor:pointer;border:0;padding:0;background:none}
.st-slot .half.l{left:0}.st-slot .half.r{right:0}
.st-slot .half:focus-visible{opacity:1;outline:3px solid var(--gold);background:rgba(201,150,43,.25)}
.panel .list-group-item{background:transparent;border-color:var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px}
.spinner-wrap{padding:3rem;text-align:center;color:var(--muted)}
/* Tailwind-класс .collapse (visibility:collapse) конфликтует с Bootstrap .collapse и прячет меню навбара */
.collapse{visibility:visible!important}
#toast{position:fixed;right:1rem;bottom:1rem;z-index:2000;max-width:22rem}
@media(max-width:576px){.hide-sm{display:none}}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="brand" href="#/">BookCircle</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Меню"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav me-auto" id="menu"></ul><div id="auth-box" class="flex items-center gap-2"></div></div>
  </div>
</nav>
<div class="container pt-3" id="alerts"></div>
<main class="container py-4" id="app" aria-live="polite"></main>
<div id="toast"></div>
<div class="modal fade" id="cm" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="cm-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button></div>
  <div class="modal-body" id="cm-body"></div>
  <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button><button type="button" class="btn btn-pine" id="cm-ok"></button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ===================== НАСТРОЙКИ ===================== */
const API = window.BOOKCIRCLE_API || (location.protocol === 'file:' ? 'http://127.0.0.1:8000/api' : '/api');  // сайт и API на одном адресе (Django / Docker)
const PAGE = 8;                            // элементов на странице

/* ===================== УТИЛИТЫ ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
let me = null;
let alertState = {count: 0, overdue: 0, results: []};
let rid = 0;  // номер текущей навигации: ответы устаревших страниц не должны затирать новую
const LOAN = {pending:['Ожидает','warning'],accepted:['Принята','info'],rejected:['Отклонена','secondary'],cancelled:['Отменена','secondary'],handed_over:['Передана','primary'],returned:['Возвращена','success']};
const READ = {want:'Хочу прочитать',reading:'Читаю',done:'Прочитал'};
const COND = {new:'Новое',good:'Хорошее',fair:'Среднее',worn:'Потрёпанное'};

function toast(msg, type = 'success') {
  const t = $('#toast');
  t.innerHTML = `<div class="alert alert-${type} shadow-sm">${esc(msg)}</div>`;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = '', 3500);
}
async function api(path, {method = 'GET', body} = {}) {
  const h = {'Content-Type': 'application/json'};
  const tk = localStorage.getItem('bc_token');
  if (tk && !/^\/auth\/(login|register|password-reset|google\/$|google\/config)/.test(path)) h.Authorization = 'Token ' + tk;  // устаревший токен не должен мешать входу
  const r0 = rid, stale = () => r0 !== rid && !path.startsWith('/auth/');
  let r;
  try { r = await fetch(API + path, {method, headers: h, body: body ? JSON.stringify(body) : undefined}); }
  catch { if (stale()) return new Promise(() => {}); throw {status: 0, data: {detail: 'Сервер недоступен. Проверьте, что Django запущен и адрес API указан верно.'}}; }
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (stale()) return new Promise(() => {});  // пользователь уже ушёл на другую страницу
  if (!r.ok) throw {status: r.status, data};
  return data;
}
const errText = e => e?.data?.detail || e?.data?.error || 'Не удалось выполнить действие. Попробуйте ещё раз.';
function fieldErrors(form, e) {
  form.querySelectorAll('.invalid-feedback').forEach(x => x.remove());
  form.querySelectorAll('.is-invalid').forEach(x => x.classList.remove('is-invalid'));
  const d = e?.data || {}; let shown = false;
  for (const [k, v] of Object.entries(d)) {
    const inp = form.elements[k]; if (!inp) continue;
    inp.classList.add('is-invalid');
    const div = document.createElement('div'); div.className = 'invalid-feedback';
    div.textContent = [].concat(v).join(' '); inp.after(div); shown = true;
  }
  if (!shown) toast(errText(e), 'danger');
}
async function submit(form, fn) {
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = form.querySelector('button:not([type=button]):not(.btn-close)'); if (btn) btn.disabled = true;
    try { await fn(Object.fromEntries(new FormData(form))); }
    catch (e) { if (e.status === 401) return go('/login'); fieldErrors(form, e); }
    if (btn) btn.disabled = false;
  });
}
const loading = () => { cleanupModals(); return app.innerHTML = '<div class="spinner-wrap"><div class="spinner-border text-success"></div><div class="mt-2">Загрузка…</div></div>'; };
const empty = (t, s = '') => `<div class="panel p-5 text-center"><h3 class="h5">${t}</h3><p class="text-secondary mb-0">${s}</p></div>`;
const fmtScore = n => String(Math.round(Number(n) * 10) / 10).replace('.', ',');  // 3.5 -> «3,5»
const starsHtml = n => { const r = Math.round(Number(n) * 2) / 2; return `<span class="stars" role="img" aria-label="Оценка ${fmtScore(n)} из 5">${[1, 2, 3, 4, 5].map(i => `<span class="st" style="--f:${r >= i ? 100 : r >= i - 0.5 ? 50 : 0}%">★</span>`).join('')}</span>`; };
const stars = n => n ? `${starsHtml(n)} <small class="text-secondary">${fmtScore(n)}</small>` : '<small class="text-secondary">Нет оценок</small>';
const starInput = (name, value) => `<div class="star-input" data-star><input type="hidden" name="${name}" value="${value || ''}"><span class="stars">${[1, 2, 3, 4, 5].map(i => `<span class="st-slot"><span class="st" style="--f:0%">★</span><button type="button" class="half l" data-v="${i - 0.5}" aria-label="${fmtScore(i - 0.5)} из 5"></button><button type="button" class="half r" data-v="${i}" aria-label="${i} из 5"></button></span>`).join('')}</span><span class="small text-secondary ms-2" data-val></span></div>`;
function initStarInput(root) {
  root.querySelectorAll('[data-star]').forEach(w => {
    const inp = w.querySelector('input');
    const paint = v => { w.querySelectorAll('.st').forEach((el, i) => el.style.setProperty('--f', (v >= i + 1 ? 100 : v >= i + 0.5 ? 50 : 0) + '%')); w.querySelector('[data-val]').textContent = v ? fmtScore(v) + ' из 5' : 'выберите оценку'; };
    paint(+inp.value || 0);
    w.querySelectorAll('.half').forEach(b => { b.onclick = () => { inp.value = b.dataset.v; paint(+b.dataset.v); }; b.onmouseenter = () => paint(+b.dataset.v); b.onmouseleave = () => paint(+inp.value || 0); });
  });
}
const cover = b => b.cover ? `<img class="cover w-100" src="${esc(b.cover)}" alt="Обложка «${esc(b.title)}»" loading="lazy">` : `<div class="cover cover-ph w-100">${esc(b.title)}</div>`;
const go = p => location.hash = '#' + p;
const list = d => Array.isArray(d) ? {results: d, count: d.length} : d;
function pager(count, page, base) {
  const n = Math.ceil(count / PAGE); if (n < 2) return '';
  return `<nav class="mt-4"><ul class="pagination justify-content-center">${Array.from({length: n}, (_, i) =>
    `<li class="page-item ${i + 1 === page ? 'active' : ''}"><a class="page-link" href="#${base}${base.includes('?') ? '&' : '?'}page=${i + 1}">${i + 1}</a></li>`).join('')}</ul></nav>`;
}
const isMod = () => me && ['moderator', 'admin'].includes(me.role);

const isAdmin = () => me && me.role === 'admin';

function cleanupModals() {  // «залипший» фон, если окно закрылось одновременно с перерисовкой страницы
  setTimeout(() => { if (!document.querySelector('.modal.show')) { document.querySelectorAll('.modal-backdrop').forEach(e => e.remove()); document.body.classList.remove('modal-open'); document.body.style.removeProperty('padding-right'); } }, 450);
}

/* Окно подтверждения в стиле сайта. Возвращает null (отмена) или {value} (подтверждено; value — текст из поля, если оно есть). */
function confirmDialog({title = 'Подтвердите действие', text = '', ok = 'Подтвердить', danger = false, input = ''}) {
  return new Promise(resolve => {
    const el = $('#cm'), m = bootstrap.Modal.getOrCreateInstance(el); let done = false;
    $('#cm-title').textContent = title;
    $('#cm-body').innerHTML = `<p class="mb-0">${esc(text)}</p>${input ? `<label class="form-label mt-3" for="cm-input">${esc(input)}</label><textarea class="form-control" id="cm-input" rows="2" maxlength="300"></textarea>` : ''}`;
    const okb = $('#cm-ok'); okb.textContent = ok; okb.className = 'btn ' + (danger ? 'btn-danger' : 'btn-pine');
    const finish = v => { if (!done) { done = true; resolve(v); } };
    okb.onclick = () => { finish({value: input ? $('#cm-input').value : ''}); m.hide(); };
    el.addEventListener('hidden.bs.modal', () => finish(null), {once: true});
    m.show();
  });
}

function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); document.documentElement.setAttribute('data-bs-theme', t);
  localStorage.setItem('bc_theme', t); renderNav();
}

/* Отслеживание аренды: предупреждения о просроченных и скоро истекающих сроках (получателю и владельцу) */
function renderAlerts() {
  const box = $('#alerts'); if (!box) return;
  if (!me || !alertState.count) { box.innerHTML = ''; return; }
  const items = alertState.results.slice(0, 4).map(a => {
    const t = esc(a.book_title), who = esc(a.other), n = Math.abs(a.days_left);
    const tel = a.other_phone ? ` Телефон: <a href="tel:${esc(a.other_phone)}">${esc(a.other_phone)}</a>.` : '';
    const when = a.days_left === 0 ? 'сегодня' : `через ${n} дн.`;
    if (a.overdue) return a.role === 'borrower'
      ? `<div class="alert alert-danger mb-2"><strong>Просрочен возврат «${t}»</strong> — верните книгу владельцу ${who}, просрочка ${n} дн.${tel}</div>`
      : `<div class="alert alert-danger mb-2"><strong>«${t}» не возвращена вовремя</strong> — ${who} задерживает книгу уже ${n} дн.${tel}</div>`;
    return a.role === 'borrower'
      ? `<div class="alert alert-warning mb-2">Срок возврата «${t}» — ${when}. Верните книгу владельцу ${who}.${tel}</div>`
      : `<div class="alert alert-warning mb-2">${who} должен вернуть «${t}» ${when}.${tel}</div>`;
  }).join('');
  const more = alertState.count > 4 ? ` (и ещё ${alertState.count - 4})` : '';
  box.innerHTML = items + `<div class="small mb-2"><a href="#/loans?box=active">Все книги на руках${more}</a></div>`;
}
async function refreshAlerts() {
  if (!me) { alertState = {count: 0, overdue: 0, results: []}; return renderAlerts(); }
  try { alertState = await api('/alerts/'); } catch { return; }
  renderAlerts(); renderNav();
}

/* ===================== ШАПКА ===================== */
function renderNav() {
  const links = [['/', 'Каталог']];
  if (me) links.push(['/shelf', 'Моя полка'], ['/loans', 'Обмены'], ['/meetings', 'Встречи'], ['/reading', 'Моё чтение'], ['/submit', 'Предложить книгу']);
  if (isMod()) links.push(['/moderation', 'Модерация']);
  const cur = location.hash.slice(1) || '/';
  const badge = h => h !== '/loans' ? '' : alertState.overdue ? ` <span class="badge text-bg-danger">${alertState.overdue}</span>` : alertState.count ? ' <span class="badge text-bg-warning">!</span>' : '';
  $('#menu').innerHTML = links.map(([h, t]) => `<li class="nav-item"><a class="nav-link ${cur.split('?')[0] === h ? 'active' : ''}" href="#${h}">${t}${badge(h)}</a></li>`).join('');
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('#auth-box').innerHTML = `<button class="btn btn-sm btn-outline-light" id="theme-btn" aria-label="Переключить тему" title="${dark ? 'Светлая тема' : 'Тёмная тема'}">${dark ? '☀' : '☾'}</button>` + (me
    ? `<a class="btn btn-sm btn-outline-light" href="#/profile">${esc(me.username)}</a><button class="btn btn-sm btn-pine" id="logout">Выйти</button>`
    : `<a class="btn btn-sm btn-outline-light" href="#/login">Войти</a><a class="btn btn-sm btn-pine" href="#/register">Регистрация</a>`);
  $('#theme-btn').onclick = toggleTheme;
  $('#logout')?.addEventListener('click', async () => {
    if (!await confirmDialog({title: 'Выйти из аккаунта?', text: 'Чтобы вернуться, нужно будет войти снова.', ok: 'Выйти'})) return;
    try { await api('/auth/logout/', {method: 'POST'}); } catch {}
    localStorage.removeItem('bc_token'); me = null; alertState = {count: 0, overdue: 0, results: []}; renderAlerts();
    go('/'); renderNav(); toast('Вы вышли из аккаунта');
  });
}

/* ===================== СТРАНИЦЫ ===================== */
const bookCard = (b, reason) => `
    <a href="#/book/${b.id}" class="card-book p-2 text-decoration-none text-reset block">
      ${cover(b)}<div class="p-2"><div class="fw-bold">${esc(b.title)}</div><div class="small text-secondary">${esc(b.author)} · ${esc(b.genre)}</div>
      <div class="mt-1">${stars(b.avg_rating)}</div>
      <span class="badge ${b.available_copies ? 'text-bg-success' : 'text-bg-secondary'} mt-1">${b.available_copies ? 'Доступно: ' + b.available_copies : 'Нет свободных'}</span>
      ${reason ? `<div class="small text-success mt-1">${esc(reason)}</div>` : ''}</div></a>`;
const fmtDt = s => new Date(s).toLocaleString('ru-RU', {dateStyle: 'long', timeStyle: 'short'});

async function pCatalog(q) {
  const page = +q.get('page') || 1, s = q.get('search') || '', g = q.get('genre') || '';
  loading();
  const d = list(await api(`/books/?search=${encodeURIComponent(s)}&genre=${encodeURIComponent(g)}&page=${page}&page_size=${PAGE}`));
  const genres = ['', ...(await api('/genres/')).results];
  const rec = me && page === 1 && !s && !g ? await api('/recommendations/').catch(() => null) : null;
  app.innerHTML = `
  <h1 class="h2 mb-1">Каталог книг</h1><p class="text-secondary">Найдите книгу и запросите её у соседа по клубу.</p>
  <form class="flex flex-wrap gap-2 mb-4" id="f">
    <input class="form-control" style="max-width:340px" name="search" placeholder="Название или автор" value="${esc(s)}">
    <select class="form-select" style="max-width:200px" name="genre">${genres.map(x => `<option value="${x}" ${x === g ? 'selected' : ''}>${x || 'Все жанры'}</option>`).join('')}</select>
    <button class="btn btn-pine">Найти</button></form>
  ${rec && rec.results.length ? `<div class="mb-4"><h2 class="h5 mb-1">Рекомендуем вам</h2><p class="small text-secondary">${rec.genres.length ? 'По вашим жанрам: ' + rec.genres.map(x => esc(x.genre)).join(', ') + '.' : 'Пока мало данных о ваших вкусах — вот что популярно в клубе. Отмечайте прочитанное и ставьте оценки, и подборка станет точнее.'}</p><div class="grid grid-cols-2 md:grid-cols-4 gap-4">${rec.results.slice(0, 4).map(b => bookCard(b, b.reason)).join('')}</div></div><h2 class="h5">Все книги</h2>` : ''}
  ${d.results.length ? `<div class="grid grid-cols-2 md:grid-cols-4 gap-4">${d.results.map(b => bookCard(b)).join('')}</div>`
    : (s || g ? empty('Ничего не найдено', 'Измените запрос или сбросьте жанр.') : empty('Каталог пока пуст', 'Модератор добавит книги в разделе «Модерация». При локальном запуске выполните: python manage.py seed'))}
  ${pager(d.count, page, `/?search=${encodeURIComponent(s)}&genre=${encodeURIComponent(g)}`)}`;
  $('#f').addEventListener('submit', e => { e.preventDefault(); const f = new FormData(e.target); go(`/?search=${encodeURIComponent(f.get('search'))}&genre=${encodeURIComponent(f.get('genre'))}`); });
}

async function pBook(id) {
  loading();
  const b = await api(`/books/${id}/`);
  const copies = b.copies || [], reviews = b.reviews || [];
  const [mtd, gen] = me ? await Promise.all([api(`/meetings/?book=${id}&page_size=5`).catch(() => null), api('/genres/').catch(() => ({results: []}))]) : [null, {results: []}];
  const mts = mtd?.results || [];
  const today = new Date().toISOString().slice(0, 10);
  const open = b.is_mine && ['pending', 'rejected'].includes(b.status), direct = me && (isMod() || open);
  const ST = {pending: ['warning', 'На модерации'], rejected: ['danger', 'Отклонена'], hidden: ['secondary', 'Скрыта']};
  const banner = {pending: ['warning', 'Книга на модерации: пока она видна только вам и модераторам.'],
    rejected: ['danger', 'Книга отклонена модератором' + (b.reject_reason ? ': ' + b.reject_reason : '') + '. Исправьте данные — после сохранения она снова уйдёт на модерацию.'],
    hidden: ['secondary', 'Книга скрыта и не показывается в каталоге.']}[b.status];
  const actions = me ? `<div class="flex flex-wrap gap-2 mt-3">
    ${direct ? '<button class="btn btn-sm btn-outline-secondary" data-bk="edit">Редактировать</button>' : (b.status === 'approved' ? '<button class="btn btn-sm btn-outline-secondary" data-bk="edit">Предложить правку</button>' : '')}
    ${isMod() && b.status === 'approved' ? '<button class="btn btn-sm btn-outline-secondary" data-bk="hide">Скрыть из каталога</button>' : ''}
    ${isMod() && b.status === 'hidden' ? '<button class="btn btn-sm btn-outline-success" data-bk="unhide">Вернуть в каталог</button>' : ''}
    ${isAdmin() || open ? '<button class="btn btn-sm btn-outline-danger" data-bk="delete">Удалить книгу</button>' : ''}</div>` : '';
  app.innerHTML = `
  ${banner ? `<div class="alert alert-${banner[0]}">${esc(banner[1])}</div>` : ''}
  <div class="grid md:grid-cols-[220px_1fr] gap-6">
    <div>${cover(b)}</div>

  });

async function pLoans(q) {
  const box = q.get('box') || 'incoming', page = +q.get('page') || 1; loading();
  const d = list(await api(`/loans/?box=${box}&page=${page}&page_size=${PAGE}`));
  const role = l => me.username === l.owner ? 'owner' : 'borrower';
  const tel = p => p ? `<a href="tel:${esc(p)}">${esc(p)}</a>` : '<span class="text-secondary">не указан</span>';
  const acts = l => {
    const a = [];
    if (role(l) === 'owner') {
      if (l.status === 'pending') a.push(['accept', 'Принять', 'pine'], ['reject', 'Отклонить', 'outline-secondary']);
      if (l.status === 'accepted') a.push(['hand-over', 'Отметить передачу', 'pine'], ['cancel', 'Отменить', 'outline-secondary']);
      if (l.status === 'handed_over') a.push(['return', 'Отметить возврат', 'pine']);
    } else if (['pending', 'accepted'].includes(l.status)) a.push(['cancel', 'Отменить', 'outline-secondary']);
    return a.map(([k, t, c]) => `<button class="btn btn-sm btn-${c}" data-act="${k}" data-id="${l.id}" data-book="${esc(l.book_title)}">${t}</button>`).join('');
  };
  const due = l => l.status !== 'handed_over' ? '' : l.days_left < 0 ? `<span class="badge text-bg-danger">Просрочено на ${-l.days_left} дн.</span>`
    : l.days_left <= 2 ? `<span class="badge text-bg-warning">Вернуть ${l.days_left === 0 ? 'сегодня' : 'через ' + l.days_left + ' дн.'}</span>` : `<span class="badge bg-body-secondary text-body border">Осталось ${l.days_left} дн.</span>`;
  const tabs = [['incoming', 'Входящие'], ['outgoing', 'Исходящие'], ['active', 'На руках']];
  app.innerHTML = `<h1 class="h2">Обмены</h1>
  <ul class="nav nav-pills mb-3">${tabs.map(([k, t]) => `<li class="nav-item"><a class="nav-link ${box === k ? 'active bg-success' : 'text-success'}" href="#/loans?box=${k}">${t}</a></li>`).join('')}</ul>
  ${d.results.length ? d.results.map(l => {
    const [t, c] = LOAN[l.status] || [l.status, 'secondary'], r = role(l);
    return `<div class="panel p-3 mb-2 flex flex-wrap items-center justify-between gap-2">
      <div><div class="fw-bold">${esc(l.book_title)}</div>
      <div class="small text-secondary">${r === 'owner' ? 'Получатель: ' + esc(l.borrower) : 'Владелец: ' + esc(l.owner)} · вернуть до ${esc(l.requested_return_date || '—')}</div>
      <div class="small">${r === 'owner' ? 'Телефон получателя: ' + tel(l.borrower_phone) : (l.owner_phone ? 'Телефон владельца: ' + tel(l.owner_phone) : 'Телефон владельца появится после принятия запроса, если он указан в профиле.')}</div>
      <span class="badge text-bg-${c}">${t}</span> ${due(l)}</div>
      <div class="flex gap-2">${acts(l)}</div></div>`; }).join('')
    : empty(box === 'incoming' ? 'Входящих запросов нет' : box === 'outgoing' ? 'Вы ещё ничего не запрашивали' : 'Сейчас нет книг на руках', box === 'active' ? 'Здесь отображаются книги, которые переданы и ещё не возвращены, со сроком возврата.' : 'Загляните в каталог и выберите книгу.')}
  ${pager(d.count, page, `/loans?box=${box}`)}`;
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const ask = {reject: ['Отклонить запрос?', 'Заёмщик увидит, что запрос отклонён.', 'Отклонить'], cancel: ['Отменить обмен?', 'Запрос на «' + b.dataset.book + '» будет отменён.', 'Отменить обмен']}[b.dataset.act];
    if (ask && !await confirmDialog({title: ask[0], text: ask[1], ok: ask[2], danger: true})) return;
    b.disabled = true;
    try { await api(`/loans/${b.dataset.id}/${b.dataset.act}/`, {method: 'POST'}); toast('Готово'); pLoans(q); refreshAlerts(); }
    catch (e) { toast(errText(e), 'danger'); b.disabled = false; } });
}

/* ---- Google Identity Services: кнопка входа/привязки ---- */
let gReady = null, gHandler = null;
async function googleButton(sel, wrap, handler) {
  try {
    if (!gReady) gReady = (async () => {
      const cfg = await api('/auth/google/config/');
      if (!cfg.client_id) return false;
      await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      google.accounts.id.initialize({client_id: cfg.client_id, callback: r => gHandler && gHandler(r.credential)});
      return true;
    })();
    if (!(await gReady)) return false;
    const el = $(sel); if (!el) return false;  // страница могла смениться, пока грузился скрипт
    gHandler = handler; if (wrap) $(wrap).hidden = false;
    google.accounts.id.renderButton(el, {theme: 'outline', size: 'large', text: 'continue_with', width: 300, locale: 'ru'});
    return true;
  } catch { gReady = null; return false; }
}

function meetingActions(m) {
  if (m.is_cancelled || m.is_past) return '';
  const b = (act, t, c) => `<button class="btn btn-sm btn-${c}" data-m="${act}" data-id="${m.id}">${t}</button>`;
  let h = '';
  if (m.is_organizer || isMod()) h += b('cancel', 'Отменить встречу', 'outline-danger');
  if (m.is_joined && !m.is_organizer) h += b('leave', 'Не пойду', 'outline-secondary');
  if (!m.is_joined && !m.is_full) h += b('join', 'Пойду', 'pine');
  return h;
}

    b.disabled = true;

const errPage = (c, t, s) => app.innerHTML = `<div class="text-center py-5"><div class="display-1 brand">${c}</div><h1 class="h4">${t}</h1><p class="text-secondary">${s}</p><a class="btn btn-pine" href="#/">В каталог</a></div>`;

/* ===================== РОУТЕР ===================== */
const needAuth = ['/shelf', '/loans', '/meetings', '/reading', '/submit', '/profile', '/moderation'];
async function route() {
  rid++;
  const [path, qs] = (location.hash.slice(1) || '/').split('?'); const q = new URLSearchParams(qs || '');
  renderNav();
  if (me) refreshAlerts();
  if (needAuth.includes(path) && !me) return go('/login');
  if (path === '/moderation' && !isMod()) return errPage(403, 'Нет доступа', 'Этот раздел доступен только модераторам.');
  try {
    let m;
    if (path === '/') await pCatalog(q);
    else if ((m = path.match(/^\/book\/(\d+)$/))) await pBook(m[1]);
    else if (path === '/shelf') await pShelf(q);
    else if (path === '/loans') await pLoans(q);
    else if (path === '/meetings') await pMeetings(q);
    else if (path === '/submit') await pSubmit(q);
    else if (path === '/reading') await pReading();
    else if (path === '/moderation') await pModeration(q);
    else if (path === '/login' || path === '/register') pAuth(path.slice(1));
    else if (path === '/forgot') pForgot();
    else if (path === '/reset') pReset(q);
    else if (path === '/profile') await pProfile();
    else errPage(404, 'Страница не найдена', 'Проверьте адрес или вернитесь в каталог.');
  } catch (e) {
    if (e.status === 401) { localStorage.removeItem('bc_token'); me = null; return go('/login'); }
    if (e.status === 403) return errPage(403, 'Нет доступа', errText(e));
    if (e.status === 404) return errPage(404, 'Не найдено', errText(e));
    app.innerHTML = `<div class="alert alert-danger">${esc(errText(e))}</div>`;
  }
}
window.addEventListener('hashchange', route);
(async () => {
  if (localStorage.getItem('bc_token')) { try { me = await api('/auth/me/'); } catch { localStorage.removeItem('bc_token'); } }
  route();
})();
</script>
