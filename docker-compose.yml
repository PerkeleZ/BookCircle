services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookcircle
      POSTGRES_USER: bookcircle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookcircle}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookcircle -d bookcircle"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SEED_DEMO: ${SEED_DEMO:-1}
      POSTGRES_HOST: db
      POSTGRES_DB: bookcircle
      POSTGRES_USER: bookcircle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookcircle}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
