# Полный стек: PostgreSQL, Redis, миграции, веб (масштабируется), Celery worker + beat, nginx.
#   docker compose up --build                                   — запуск (сайт: http://localhost:8000)
#   docker compose up -d --scale web=3 --scale worker=2         — несколько экземпляров
#   docker compose logs -f web worker                           — письма (в режиме терминала) и логи
x-app: &app
  image: ${BOOKCIRCLE_IMAGE:-bookcircle:latest}  # один образ для веба, воркера и планировщика
  environment: &env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    POSTGRES_HOST: db
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookcircle}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    EMAIL_BACKEND: ${EMAIL_BACKEND:-common.mail.TerminalEmailBackend}
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-BookCircle <noreply@bookcircle.local>}
    SENTRY_DSN: ${SENTRY_DSN:-}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookcircle
      POSTGRES_USER: bookcircle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookcircle}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookcircle -d bookcircle"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:  # кэш, общие лимиты запросов и брокер очереди. В продакшене кэш и очередь лучше развести по разным экземплярам.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12}
    restart: unless-stopped

  migrate:  # одноразовая задача: миграции (и демоданные) выполняются ОДИН раз, а не в каждом экземпляре веба
    <<: *app
    build: .  # образ собирается здесь, остальные сервисы используют тот же тег
    command: ["sh", "-c", "python manage.py migrate --noinput && if [ \"$$SEED_DEMO\" = \"1\" ]; then python manage.py seed; fi"]
    environment: {<<: *env, SEED_DEMO: "${SEED_DEMO:-1}"}
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    restart: "no"

  web:  # без published-портов: масштабируется (--scale web=N), трафик идёт через nginx
    <<: *app
    depends_on: {migrate: {condition: service_completed_successfully}}
    expose: ["8000"]

  worker:  # фоновые задачи: письма и напоминания
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "${CELERY_CONCURRENCY:-2}"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck: {disable: true}

  beat:  # планировщик: ровно ОДИН экземпляр (ежедневные напоминания о просрочке)
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck: {disable: true}

  nginx:  # входная точка: балансировка между экземплярами веба, кэш статики, лимиты на вход/регистрацию
    image: nginx:1.27-alpine
    volumes: ["./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8000:80"]
    depends_on: {web: {condition: service_healthy}}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
